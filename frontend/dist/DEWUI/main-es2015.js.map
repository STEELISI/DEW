export default "<div class=\"header\">\n  <nav class=\"navbar navbar-expand-lg static-top\" style=\"padding: 0;\">\n        <div class=\"container col-md-12\">\n          <div class=\"navbar-header\">\n            \n          <a class=\"navbar-brand\" href=\"#\">\n            <img\n              src=\"./assets/isi_logo.gif\"\n              class=\"img-thumbnail\"\n              style=\"border:none;height: 35px;\"\n              alt=\"\"\n            />\n          </a>\n         \n          </div>\n\n      \n          <button\n            class=\"navbar-toggler\"\n            type=\"button\"\n            data-toggle=\"collapse\"\n            data-target=\"#navbarResponsive\"\n            aria-controls=\"navbarResponsive\"\n            aria-expanded=\"false\"\n            aria-label=\"Toggle navigation\"\n          >\n            <span class=\"navbar-toggler-icon\"></span>\n          </button>\n\n          <div class=\"navbar-nav pointer\" [matMenuTriggerFor]=\"menu\">\n            <div class=\"profile\" *ngIf=\"!loggedIn\"></div>\n            <div class=\"profile_img\" *ngIf=\"loggedIn\"><img src=\"{{img}}\" width=\"40px\" height=\"40px\"></div>\n            <div class=\"username\"><span *ngIf=\"!loggedIn\">Login / Sign Up!</span><span *ngIf=\"loggedIn\">{{fullName}}</span></div>\n            <mat-menu #menu=\"matMenu\">\n              <button mat-menu-item (click)=\"loginWithGoogle()\" *ngIf=\"!loggedIn\">Login with Google</button>\n              <button mat-menu-item *ngIf=\"!loggedIn\">Sign Up</button>\n              <button mat-menu-item *ngIf=\"loggedIn\" (click)=\"logout()\">Logout</button>\n            </mat-menu>\n          </div>\n\n      \n    </div>\n    <!-- <div class=\"collapse navbar-collapse\" id=\"navbarResponsive\">\n        <ul class=\"navbar-nav ml-auto\">\n          <li class=\"nav-item active\">\n            <a class=\"nav-link\" href=\"#\">Home\n                  <span class=\"sr-only\">(current)</span>\n                </a>\n          </li>\n          <li class=\"nav-item\">\n            <a class=\"nav-link\" href=\"#\">About</a>\n          </li>\n          <li class=\"nav-item\">\n            <a class=\"nav-link\" href=\"#\">Services</a>\n          </li>\n          <li class=\"nav-item\">\n            <a class=\"nav-link\" href=\"#\">Contact</a>\n          </li>\n        </ul>\n      </div> -->\n  </nav>\n</div>\n"
