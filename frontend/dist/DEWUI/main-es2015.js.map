export default "\n  <mat-tab-group>\n    <mat-tab *ngFor=\"let x of menuList\" label=\"{{ x.name }}\">\n   <div *ngIf=\"x.id ==1\">\n        <hlb></hlb>\n      </div>\n\n      <div *ngIf=\"x.id ==2\">\n        <nlp></nlp>\n      </div>\n\n      <div *ngIf=\"x.id ==3\">\n        <dependency-graph></dependency-graph>\n      </div> \n\n      <div *ngIf=\"x.id ==4\">\n        <upload></upload>\n      </div> \n      \n    </mat-tab>\n  </mat-tab-group> \n\n"
