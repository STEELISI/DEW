export default "<div class=\"container\">\n  <mat-card>\n    <div class=\"row\">\n      <div class=\"col-md-12\" >\n        <div style=\"margin: .6em;\" >\n          <span>Suggestions:</span>\n          <button\n            type=\"button\"\n            class=\"btn btn-outline-primary word-bubble-button\"\n            *ngFor=\"let word of wordlist | textfilter: nlpTextFilter\"\n            (click)=\"insertValue(word.value)\"\n          >\n            {{ word.value }}\n          </button>\n        </div>\n        <div class=\"flex-container\">\n          <quill-editor\n            [styles]=\"{ height: '500px' }\"\n            [modules]=\"{ counter: { container: '#editor1' }, toolbar: false }\"\n            [(ngModel)]=\"nlpText\"\n            (onContentChanged)=\"logChange($event, 1)\"\n            (onEditorCreated)=\"created($event)\"\n          ></quill-editor>\n        </div>\n      </div>\n    </div>\n    <div class=\"row\">\n      <div class=\"col-md-12\">\n        <div style=\"float:right\">\n          <button type=\"button\" class=\"btn btn-outline-primary word-bubble-button\" (click)=\"save()\">Save</button>\n        </div>\n      </div>\n    </div>\n  </mat-card>\n</div>\n"
