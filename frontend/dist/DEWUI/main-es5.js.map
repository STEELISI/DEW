export default "<div class=\"row\" *ngIf=\"alive\">\n  <div class=\"col-md-12\">\n    <p>Authenticating User...</p>\n  </div>\n</div>\n\n<div\n  class=\"row\"\n  *ngIf=\"!alive\"\n  style=\"margin: 5%; margin-left: 26%; margin-right: 26%;\"\n>\n  <div class=\"container\">\n    <div class=\"col-md-12\">\n      <mat-card>\n        <div class=\"row\" style=\"text-align: center;\">\n          <div class=\"col-md-12\">\n            <div class=\"navbar-header\">\n              <a class=\"navbar-brand\" href=\"#\">\n                <img\n                  src=\"./assets/isi_logo.gif\"\n                  class=\"img-thumbnail\"\n                  style=\"border: none; height: 35px;\"\n                  alt=\"\"\n                />\n              </a>\n            </div>\n          </div>\n        </div>\n        <div class=\"row\" style=\"text-align: center;\">\n          <mat-form-field class=\"col-md-12\" appearance=\"outline\">\n            <mat-label>User Handle</mat-label>\n            <input\n              matInput\n              [(ngModel)]=\"userHandle\"\n              name=\"handle\"\n              pattern=\"[a-zA-Z0-9_]*\"\n              placeholder=\"Ex. @david_miller\"\n              (change)=\"checkHandle()\"\n            />\n            <mat-icon\n              matPrefix\n              class=\"fas fa-at pointer blue\"\n              (click)=\"enablePassword()\"\n            ></mat-icon>\n           \n           <mat-error>Pattern: combination of alphabet, number and underscore.</mat-error>\n           <mat-hint style=\"color:red\"*ngIf=\"isExist()\">User already Exists</mat-hint>\n          </mat-form-field>\n        </div>\n\n        <div class=\"row\" style=\"text-align: center;\">\n          <mat-form-field class=\"col-md-12\" appearance=\"outline\">\n            <mat-label>Email</mat-label>\n            <input matInput [(ngModel)]=\"emailId\" name=\"email\"  disabled />\n          </mat-form-field>\n        </div>\n        <div class=\"row\" style=\"text-align: center;\">\n          <mat-form-field class=\"col-md-12\" appearance=\"outline\">\n            <mat-label>Name</mat-label>\n            <input matInput [(ngModel)]=\"fullName\" name=\"name\" disabled />\n          </mat-form-field>\n        </div>\n        <div class=\"row\" style=\"text-align: center;\">\n          <div class=\"col-md-12\">\n            <button mat-stroked-button (click)=\"register()\" class=\"button\" [disabled]='!isEnable()'>\n              Register\n            </button>\n            <button mat-stroked-button (click)=\"cancel()\" class=\"button\">\n              Cancel\n            </button>\n          </div>\n        </div>\n      </mat-card>\n    </div>\n  </div>\n</div>\n"
