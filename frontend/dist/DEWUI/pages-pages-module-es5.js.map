export default "\n  <mat-tab-group>\n    <mat-tab *ngFor=\"let x of menuList\" label=\"{{ x.name }}\">\n\n      <div *ngIf=\"x.id == 1\" class=\"tab\">\n\n        Welcome {{userDetails.name}}!\n      </div>\n      <div *ngIf=\"x.id == 2\" class=\"tab\">\n        <experiment></experiment>\n        </div>\n    </mat-tab>\n  </mat-tab-group> \n\n"
