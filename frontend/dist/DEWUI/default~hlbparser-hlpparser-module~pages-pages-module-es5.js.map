export default "<!-- <h1 mat-dialog-title>Hi {{data.name}}</h1>\n<div mat-dialog-content>\n  <p>What's your favorite animal?</p>\n  <mat-form-field>\n    <input matInput [(ngModel)]=\"data.animal\">\n  </mat-form-field>\n</div>\n<div mat-dialog-actions>\n  <button mat-button (click)=\"onNoClick()\">No Thanks</button>\n  <button mat-button [mat-dialog-close]=\"data.animal\" cdkFocusInitial>Ok</button>\n</div> -->\n\n\n\n<div mat-dialog-content>\n  <div class=\"row\" style=\"margin: .5em;\" >\n    <div class=\"col-md-12\" style=\"padding: 0;\">\n  \n          <div class=\"row\">\n           \n              <mat-form-field class=\"col-md-8\" appearance=\"outline\">\n                <mat-label>User Handle</mat-label>\n                <input type=\"text\"\n                       placeholder=\"User Handle\"\n                       aria-label=\"string\"\n                       matInput\n                       [(ngModel)]=\"UserObj.handle\"\n                       [formControl]=\"userHandleSelect\"\n                       [matAutocomplete]=\"UserInfo\">\n                <mat-autocomplete #UserInfo=\"matAutocomplete\">\n                  <mat-option *ngFor=\"let option of filteredUserHandle | async\" [value]=\"option.value\">\n                   {{option.name +\" <\"+option.value+\"> \"}}\n                  </mat-option>\n                </mat-autocomplete>\n              </mat-form-field>\n        \n              <mat-form-field class=\"col-md-4\" appearance=\"outline\">\n                <mat-label>Access Level</mat-label>\n                <mat-select [(ngModel)]=\"this.UserObj.access\" required >\n                  <mat-option *ngFor=\"let option of filteredLevels | async\" [value]=\"option.value\">\n                    {{option.name}}\n                  </mat-option>\n                </mat-select>\n              </mat-form-field>\n       \n      </div>\n\n\n    </div>\n  </div> \n</div>\n\n      <div mat-dialog-actions>\n        <button mat-button (click)=\"onNoClick()\">Cancel</button>\n        <button mat-button [disabled]=\"isAddDisabled()\" [mat-dialog-close]=\"UserObj\" cdkFocusInitial>Add</button>\n      </div>  "
