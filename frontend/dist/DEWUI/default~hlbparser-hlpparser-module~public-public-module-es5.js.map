export default "<div class=\"row\">\n  <div class=\"col-md-8\">\n    <div class=\"row\" style=\"margin: 0.5em;\">\n      <div class=\"col-md-12\" style=\"padding: 0;\">\n        <mat-card>\n          <mat-form-field class=\"col-md-12\" appearance=\"outline\">\n            <mat-label>Experiment Name</mat-label>\n            <input\n            [disabled]=\"onlyReadable()\"\n              matInput\n              [(ngModel)]=\"experiment.name\"\n              (change)=\"setExperimentName()\"\n            />\n          </mat-form-field>\n\n          <mat-form-field class=\"col-md-12\" appearance=\"outline\">\n            <mat-label>Experiment Description</mat-label>\n            <textarea\n            [disabled]=\"onlyReadable()\"\n              matInput\n              [(ngModel)]=\"experiment.description\"\n              (change)=\"setExperimentDescription()\"\n            ></textarea>\n          </mat-form-field>\n        </mat-card>\n      </div>\n    </div>\n  </div>\n  <div class=\"col-md-4\">\n    <div style=\"text-align: center; padding: 1em;\" *ngIf=\"!onlyReadable()\">\n      <button mat-stroked-button (click)=\"save()\">Save</button>\n    </div>\n  </div>\n</div>\n"
