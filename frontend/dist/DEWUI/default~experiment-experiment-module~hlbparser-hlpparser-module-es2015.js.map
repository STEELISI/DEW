export default "<div mat-dialog-content>\n    <div class=\"row\" style=\"margin: .5em;\" >\n      <div class=\"col-md-12\" style=\"padding: 0;\">\n    \n        <table class=\"table\">\n            <thead >\n                <tr >\n                 \n                    <th style=\"min-width:250px\">Name</th>\n                    <th style=\"min-width:50px\">Handle</th>\n                    <th style=\"min-width:50px\">Access Level</th> \n                   \n                    <th ></th>\n                </tr>\n            </thead>\n            <tbody *ngIf=\"userAccessList.length!=0\" >\n                <tr *ngFor=\"let item of userAccessList; let i=index\" >\n                 \n                    <td><strong>{{ item.name }}</strong></td>\n                    <td><strong>{{ '@'+item.handle }}</strong></td>\n                     <td><strong>{{ item.accessLevel }}</strong></td> \n    \n                    <td>\n           \n                      <i class=\"far fa-trash-alt pointer\" (click)=\"deleteUser(item)\"></i></td>\n      \n                </tr>\n            </tbody>\n            <tbody style=\"text-align: center;\"  *ngIf=\"userAccessList.length==0\" >\n              <tr >\n                <td colspan=\"3\" ><span ><i>No User has been granted access for this experiment.</i> </span></td>\n                  \n      \n              </tr>\n          </tbody>\n       \n        </table>\n      </div>\n    </div> \n  </div>\n"
