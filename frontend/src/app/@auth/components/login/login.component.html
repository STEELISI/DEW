<div class="row" *ngIf="alive">
  <div class="col-md-12">
    <p>Authenticating User...</p>
  </div>
</div>

<div class="row" *ngIf="!alive" style="margin: 5%;margin-left: 26%;margin-right: 26%;">
  <div class="container">
    <div class="col-md-12">
      <mat-card>
        <div class="row" style="text-align: center;">
          <div class="col-md-12"><h3>Login!</h3></div>
        </div>
        <div class="row" style="text-align: center;">
          <div class="col-md-12" >
            <mat-form-field class="col-md-12">
              <mat-label>Email</mat-label>
              <input matInput [(ngModel)]="emailId" name="email" />
            </mat-form-field>
            <p>or</p>
          </div>
        </div>
        <div class="row" style="text-align: center;">
          <div class="col-md-12" >
            <button mat-stroked-button (click)="login()">Login using Google!</button>
          </div>
        </div>
      </mat-card>
    </div>
  </div>
</div>
