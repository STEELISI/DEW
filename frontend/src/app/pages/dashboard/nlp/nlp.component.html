<div class="container">
  <mat-card>
    <div class="row">
      <div class="col-md-12" >
        <div style="margin: .6em;" >
          <span>Suggestions:</span>
          <button
            type="button"
            class="btn btn-outline-primary word-bubble-button"
            *ngFor="let word of wordlist | textfilter: nlpTextFilter"
            (click)="insertValue(word.value)"
          >
            {{ word.value }}
          </button>
        </div>
        <div class="flex-container">
          <quill-editor
            [styles]="{ height: '500px' }"
            [modules]="{ counter: { container: '#editor1' }, toolbar: false }"
            [(ngModel)]="nlpText"
            (onContentChanged)="logChange($event, 1)"
            (onEditorCreated)="created($event)"
          ></quill-editor>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div style="float:right">
          <button type="button" class="btn btn-outline-primary word-bubble-button" (click)="save()">Save</button>
        </div>
      </div>
    </div>
  </mat-card>
</div>
