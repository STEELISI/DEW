<div class="row" *ngIf="show">



  <div class="col-md-10" style="    margin: 2em;">
    
    <mat-card> 
    <table class="table">
      <thead >
          <tr >
            <th style="min-width:50px">Exp. Id</th>
              <th style="min-width:150px">Experiment Name</th>
              <th style="min-width:150px">Experiment Description</th>
              <th style="min-width:150px">Last Created Date</th>
              <th style="min-width:150px">Last Updated Date</th>
              <th >  <button mat-button style="margin: 0;   width:20px; height: 20px;line-height: 0;"><i (click)="create()" class="fas fa-plus"></i></button>
              </th>
          </tr>
      </thead>
      <tbody *ngIf="experiments.length!=0" >
          <tr *ngFor="let item of experiments; let i=index" >
            <td>{{item.experiment_id}}</td>
              <td><strong>{{ item.name }}</strong></td>
              <td><strong>{{ item.description }}</strong></td>
              <td><strong>{{ item.created_date }}</strong></td>
              <td><strong>{{ item.updated_date }}</strong></td>
              <td>
                <i class="fas fa-copy pointer" (click)="copy(item)"></i>
                <i class="fas fa-edit pointer" (click)="edit(item)"></i>
                <i class="far fa-trash-alt pointer" (click)="delete(item)"></i></td>

          </tr>
      </tbody>
      <tbody class="upload-name"  *ngIf="experiments.length==0" >
        <tr >
          <td colspan="3" ><span ><i>No saved experiments.</i> </span></td>
            

        </tr>
    </tbody>
 
  </table>
  </mat-card>
    </div>
</div>
