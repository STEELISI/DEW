<div class="row" >



  <div class="col-md-10" style="    margin: 2em;">
    
    <mat-card> 
      <button Mat-button class="btn btn-primary" style="float:right;margin: 1em;" (click)="create()">create new experiment</button>
    <table class="table">
      <thead >
          <tr >
            <th style="min-width:150px">Exp. Id</th>
              <th style="min-width:250px">Experiment Name</th>
              <th style="min-width:350px">Experiment Description</th>
              <th style="min-width:150px">Last Updated Date</th>
              <th ></th>
          </tr>
      </thead>
      <tbody *ngIf="experiments.length!=0" >
          <tr *ngFor="let item of experiments; let i=index" >
            <td>{{item.id}}</td>
              <td><strong>{{ item.name }}</strong></td>
              <td><strong>{{ item.description }}</strong></td>
              <td><strong>{{ item.lastUpdatedDate }}</strong></td>
              <td>
     
                <i class="fas fa-edit pointer" (click)="edit(item)"></i>
                <i class="far fa-trash-alt pointer" (click)="delete(i)"></i></td>

          </tr>
      </tbody>
      <tbody class="upload-name"  *ngIf="experiments.length==0" >
        <tr >
          <td colspan="3" ><span ><i>No saved experiments.</i> </span></td>
            

        </tr>
    </tbody>
 
  </table>
  </mat-card>
    </div>
</div>
