<div mat-dialog-content>
  <div class="row" style="margin: .5em;" >
    <div class="col-md-12" style="padding: 0;">
  
          <div class="row">
           
              <mat-form-field class="col-md-8">
                <input type="text"
                       placeholder="User Name"
                       aria-label="string"
                       matInput
                       [(ngModel)]="UserObj.handle"
                       [formControl]="userHandleSelect"
                       [matAutocomplete]="UserInfo">
                <mat-autocomplete #UserInfo="matAutocomplete">
                  <mat-option *ngFor="let option of filteredUserHandle | async" [value]="option.value">
                   {{option.name +" <"+option.value+"> "}}
                  </mat-option>
                </mat-autocomplete>
              </mat-form-field>
        

        <mat-form-field class="col-md-4">
          <input type="text"
                 placeholder="Access Level"
                 aria-label="string"
                 matInput
                 [(ngModel)]="UserObj.access"
                 [formControl]="accessLevelControl"
                 [matAutocomplete]="auto">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredLevels | async" [value]="option.value">
              {{option.name}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>


    </div>
  </div> 
</div>

      <div mat-dialog-actions>
        <button mat-button (click)="onNoClick()">Cancel</button>
        <button mat-button [mat-dialog-close]="UserObj" cdkFocusInitial>Add</button>
      </div>
