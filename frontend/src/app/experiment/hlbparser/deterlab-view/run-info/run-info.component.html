<div class="container" >
    <div class="row" *ngIf="!errorFlag">
        <div class="col-md-12" >
            <div class="row" >
        <div class="col-md-4" *ngIf="logList.length!=0">
            <select class="form-control" [(ngModel)]="logid">
                <option *ngFor="let o of logList" [value]='o.id' >{{o.started_at}}</option>
            </select>
            
            
            </div>
            <div class="col-sm-4" >
                <button class="form-control" (click)="showDetails()">Show Details</button>
            </div>
            <div class="col-md-4" *ngIf="loader">
                <div class="spinner-border" role="status"></div>
            </div>
           
            </div>
            <div class="row" style="margin:0.5em" *ngIf="!loader">
                <div class="col-md-12">

                    <mat-accordion>
                        
                        <mat-expansion-panel (opened)="panelOpenState = true"
                                             (closed)="panelOpenState = false"
                                             *ngFor="let s of executionScript;let i=index" >
                          <mat-expansion-panel-header>
                            <mat-panel-title>
                              {{'script '+(i+1) }}
                            </mat-panel-title>
                            <mat-panel-description>
                                
                            <span style="color:green" *ngIf="(s.status=='0')">
                              Status: Successful
			      <!-- <span style="color:red" *ngIf="(s.error!='')">
                                    {{' (with Error)'}}
                                </span>-->
                            </span>
                            <span style="color:green" *ngIf="( s.status!='0')">
                                Status: Un Successfull <span style="color:red" *ngIf="(s.error!='')">
                                    {{' (with Error)'}}
                                </span>
                            </span>
                            </mat-panel-description>
                          </mat-expansion-panel-header>
                          <div class="col-md-12" >
                            <span style="color:red" *ngIf="(s.error!='')">
                                {{'Error: '+s.error }}
                            </span>
                            <div class="col-md-12" style="background-color: black;color: white;">
                            <p 
                                >{{s.script}}</p>
                            </div>
                        </div>
                        </mat-expansion-panel>
                      </mat-accordion>

                </div>
            </div>

            
        
    
</div>
    </div>
    <div class="row" [hidden]="!errorFlag">
        <div class="col-md-4">
            <p>{{error}}</p>
            </div>

    </div>
</div>
